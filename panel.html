<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Comandas | Los Taqueiros</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="Recursos/logo/logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Fredoka:wght@500;600;700&family=Libre+Franklin:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --rojo:#C1272D;
    --rojo-oscuro:#8A1B1F;
    --rojo-brillo:#E14A42;
    --crema:#F7ECD6;
    --crema-suave:#FFF8EA;
    --carbon:#1C1210;
    --carbon-2:#241714;
    --carbon-3:#2E1D19;
    --mostaza:#E3A008;
    --verde:#5C7A3B;
    --verde-brillo:#7FA855;
    --texto-claro:#F7ECD6;
    --texto-secundario:#B9A88C;
    --borde:rgba(247,236,214,.10);
    --radio:14px;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Libre Franklin', sans-serif;
    background:var(--carbon);
    color:var(--texto-claro);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit; cursor:pointer; border:none;}
  h1,h2,h3{font-family:'Anton', sans-serif; text-transform:uppercase; letter-spacing:.02em; line-height:1;}

  /* ---------- LOGIN ---------- */
  .login-screen{
    position:fixed; inset:0; z-index:900;
    display:flex; align-items:center; justify-content:center; padding:1.5rem;
    background:
      radial-gradient(circle at 25% 20%, rgba(193,39,45,.30), transparent 55%),
      linear-gradient(160deg, var(--carbon) 0%, var(--carbon-2) 60%, #150d0b 100%);
  }
  .login-screen.hidden{display:none;}
  .login-card{
    width:min(400px, 100%); background:var(--carbon-2);
    border:1px solid var(--borde); border-radius:20px;
    padding:2.2rem 1.8rem; box-shadow:0 24px 60px rgba(0,0,0,.5);
  }
  .login-card img{width:76px; margin:0 auto 1.2rem; display:block; border-radius:14px; background:var(--crema); padding:6px;}
  .login-card h1{font-size:1.5rem; text-align:center; margin-bottom:.4rem;}
  .login-card p.sub{text-align:center; color:var(--texto-secundario); font-size:.85rem; margin-bottom:1.6rem;}
  .login-card label{display:block; font-size:.75rem; font-weight:700; color:var(--texto-secundario); margin-bottom:.35rem; text-transform:uppercase; letter-spacing:.06em;}
  .login-card input{
    width:100%; font-family:inherit; font-size:16px; padding:.85rem .9rem;
    border-radius:12px; border:1px solid var(--borde);
    background:var(--carbon); color:var(--texto-claro); margin-bottom:1rem;
  }
  .login-card input:focus{outline:2px solid var(--rojo); outline-offset:1px;}
  .login-card button{
    width:100%; background:var(--rojo); color:var(--crema-suave);
    padding:.95rem; border-radius:999px; font-weight:800; font-size:1rem;
    transition:background .2s ease, transform .2s ease;
  }
  .login-card button:hover:not(:disabled){background:var(--rojo-brillo); transform:translateY(-2px);}
  .login-card button:disabled{opacity:.5; cursor:not-allowed;}
  .login-error{color:#ff8f85; font-size:.82rem; text-align:center; margin-top:.9rem; min-height:1.1em;}

  /* ---------- HEADER ---------- */
  header{
    position:sticky; top:0; z-index:100;
    display:flex; align-items:center; gap:1rem; flex-wrap:wrap;
    padding:.85rem 1.2rem;
    background:rgba(28,18,16,.96); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--borde);
  }
  .brand{display:flex; align-items:center; gap:.7rem; margin-right:auto;}
  .brand img{height:40px; width:40px; object-fit:contain; border-radius:10px; background:var(--crema); padding:4px;}
  .brand .txt{display:flex; flex-direction:column; line-height:1.15;}
  .brand .txt strong{font-family:'Anton', sans-serif; font-size:1.05rem; letter-spacing:.03em;}
  .brand .txt small{color:var(--texto-secundario); font-size:.72rem;}

  .conn{
    display:flex; align-items:center; gap:.45rem;
    font-size:.75rem; font-weight:700; color:var(--texto-secundario);
    background:var(--carbon-2); border:1px solid var(--borde);
    padding:.5rem .8rem; border-radius:999px;
  }
  .conn .dot{width:8px; height:8px; border-radius:50%; background:var(--mostaza);}
  .conn.online .dot{background:var(--verde-brillo); box-shadow:0 0 0 3px rgba(127,168,85,.2);}
  .conn.offline .dot{background:var(--rojo-brillo);}

  .tool-btn{
    background:var(--carbon-2); color:var(--texto-claro);
    border:1px solid var(--borde); border-radius:999px;
    padding:.55rem .95rem; font-size:.78rem; font-weight:700;
    display:inline-flex; align-items:center; gap:.4rem;
    transition:background .2s ease, border-color .2s ease;
  }
  .tool-btn:hover{background:var(--carbon-3); border-color:rgba(247,236,214,.25);}
  .tool-btn.activo{background:var(--verde); border-color:var(--verde); color:var(--crema-suave);}
  .tool-btn.peligro:hover{background:var(--rojo-oscuro); border-color:var(--rojo);}

  /* ---------- INTERRUPTOR ABIERTO / CERRADO ---------- */
  .switch-local{
    display:inline-flex; align-items:center; gap:.5rem;
    background:var(--carbon-2); border:1px solid var(--borde);
    border-radius:999px; padding:.4rem .5rem .4rem .9rem;
    font-size:.78rem; font-weight:800;
  }
  .switch-local .etiqueta{white-space:nowrap;}
  .switch-local.abierto{border-color:rgba(92,122,59,.6); color:var(--verde-brillo);}
  .switch-local.cerrado{border-color:rgba(225,74,66,.6); color:var(--rojo-brillo);}
  .switch-pista{
    width:44px; height:24px; border-radius:999px; position:relative;
    background:var(--rojo-oscuro); transition:background .25s ease; flex:none;
  }
  .switch-local.abierto .switch-pista{background:var(--verde);}
  .switch-pista::after{
    content:""; position:absolute; top:3px; left:3px;
    width:18px; height:18px; border-radius:50%;
    background:var(--crema-suave); transition:transform .25s ease;
  }
  .switch-local.abierto .switch-pista::after{transform:translateX(20px);}

  /* ---------- PANEL DE HORARIOS ---------- */
  .modal-fondo{
    position:fixed; inset:0; z-index:800;
    background:rgba(10,6,5,.66); backdrop-filter:blur(5px);
    display:flex; align-items:center; justify-content:center; padding:1.2rem;
    opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  .modal-fondo.open{opacity:1; pointer-events:auto;}
  .modal-horarios{
    background:var(--carbon-2); border:1px solid var(--borde);
    border-radius:18px; width:min(520px,100%); max-height:88vh; overflow-y:auto;
    padding:1.4rem 1.3rem; box-shadow:0 24px 60px rgba(0,0,0,.55);
  }
  .modal-horarios h2{font-size:1.05rem; margin-bottom:.3rem;}
  .modal-horarios .ayuda{font-size:.8rem; color:var(--texto-secundario); margin-bottom:1.1rem; line-height:1.5;}
  .fila-dia{
    display:flex; align-items:center; gap:.6rem;
    padding:.5rem 0; border-bottom:1px solid rgba(247,236,214,.05);
  }
  .fila-dia .nombre{flex:1; font-size:.85rem; font-weight:700; min-width:80px;}
  .fila-dia input[type="time"]{
    background:var(--carbon); color:var(--texto-claro);
    border:1px solid var(--borde); border-radius:8px;
    padding:.4rem .5rem; font-family:inherit; font-size:.85rem;
  }
  .fila-dia input[type="time"]:disabled{opacity:.35;}
  .fila-dia .abre-cierra{display:flex; align-items:center; gap:.35rem;}
  .fila-dia label.activo{
    display:flex; align-items:center; gap:.3rem;
    font-size:.72rem; color:var(--texto-secundario); cursor:pointer; user-select:none;
  }
  .campo-mensaje{
    width:100%; margin-top:1rem; padding:.7rem .8rem; border-radius:10px;
    background:var(--carbon); color:var(--texto-claro);
    border:1px solid var(--borde); font-family:inherit; font-size:.85rem; resize:vertical;
  }
  .acciones-modal{display:flex; gap:.6rem; margin-top:1.2rem;}
  .acciones-modal button{
    flex:1; padding:.85rem; border-radius:999px; font-weight:800; font-size:.9rem;
  }
  .btn-guardar{background:var(--verde); color:var(--crema-suave);}
  .btn-guardar:hover{background:var(--verde-brillo);}
  .btn-cancelar{background:rgba(247,236,214,.08); color:var(--texto-claro);}
  .btn-cancelar:hover{background:rgba(247,236,214,.16);}

  /* ---------- KANBAN ---------- */
  .board{
    display:grid; grid-template-columns:repeat(5, minmax(280px, 1fr));
    gap:1rem; padding:1.2rem; align-items:start;
    overflow-x:auto; min-height:calc(100vh - 72px);
  }
  @media (max-width:1400px){ .board{grid-template-columns:repeat(5, minmax(265px, 1fr));} }
  @media (max-width:1100px){
    .board{display:flex; overflow-x:auto; scroll-snap-type:x mandatory;}
    .col{flex:0 0 300px; scroll-snap-align:start;}
  }

  .col{
    background:var(--carbon-2); border:1px solid var(--borde);
    border-radius:var(--radio); display:flex; flex-direction:column;
    max-height:calc(100vh - 100px);
  }
  .col-head{
    display:flex; align-items:center; gap:.6rem;
    padding:.9rem 1rem; border-bottom:1px solid var(--borde);
    position:sticky; top:0; background:var(--carbon-2);
    border-radius:var(--radio) var(--radio) 0 0; z-index:2;
  }
  .col-head .punto{width:10px; height:10px; border-radius:50%; flex:none;}
  .col-head h2{font-size:.92rem; letter-spacing:.06em;}
  .col-head .contador{
    margin-left:auto; background:var(--carbon); color:var(--texto-claro);
    border:1px solid var(--borde); font-size:.75rem; font-weight:800;
    min-width:26px; height:26px; border-radius:999px;
    display:flex; align-items:center; justify-content:center; padding:0 .5rem;
  }
  .col[data-estado="nuevo"]           .punto{background:var(--rojo-brillo);}
  .col[data-estado="en_preparacion"]  .punto{background:var(--mostaza);}
  .col[data-estado="listo"]           .punto{background:var(--verde-brillo);}
  .col[data-estado="entregado"]       .punto{background:#6b8fa8;}
  .col[data-estado="cancelado"]       .punto{background:#7a6a5c;}

  .col-body{padding:.8rem; display:flex; flex-direction:column; gap:.8rem; overflow-y:auto;}
  .col-vacia{color:#6b5c4c; font-size:.82rem; text-align:center; padding:1.6rem .5rem;}

  /* ---------- TARJETA DE PEDIDO ---------- */
  .pedido{
    background:var(--carbon-3); border:1px solid var(--borde);
    border-radius:12px; padding:.9rem; cursor:pointer;
    transition:border-color .2s ease, transform .15s ease;
  }
  .pedido:hover{border-color:rgba(247,236,214,.28); transform:translateY(-2px);}
  .pedido.sin-ver{
    border-color:var(--rojo-brillo);
    animation:latido 1.4s ease-in-out infinite;
  }
  @keyframes latido{
    0%,100%{box-shadow:0 0 0 0 rgba(225,74,66,.55);}
    50%{box-shadow:0 0 0 7px rgba(225,74,66,0);}
  }

  .pedido-top{display:flex; align-items:center; gap:.5rem; margin-bottom:.6rem; flex-wrap:wrap;}
  .pedido-num{font-family:'Anton', sans-serif; font-size:1.1rem; letter-spacing:.03em;}
  .pedido-hora{color:var(--texto-secundario); font-size:.74rem; margin-left:auto;}
  .badge-pagado{
    background:var(--verde); color:var(--crema-suave);
    font-size:.68rem; font-weight:800; letter-spacing:.04em;
    padding:.25rem .5rem; border-radius:6px; white-space:nowrap;
  }

  .pedido-cliente{font-size:.88rem; font-weight:700; margin-bottom:.15rem;}
  .pedido-tel{font-size:.82rem; color:var(--mostaza); font-weight:700; text-decoration:none;}
  .pedido-tel:hover{text-decoration:underline;}
  .pedido-entrega{
    font-size:.78rem; color:var(--texto-secundario); margin-top:.5rem;
    line-height:1.5; padding-top:.5rem; border-top:1px dashed var(--borde);
  }
  .pedido-entrega .dir{color:var(--texto-claro);}
  .pedido-envio{
    display:flex; align-items:center; gap:.4rem; flex-wrap:wrap;
    margin-top:.45rem; font-size:.76rem; font-weight:700; color:var(--verde-brillo);
  }
  .pedido-envio .fuera{color:var(--mostaza);}
  .btn-mapa{
    display:inline-flex; align-items:center; gap:.3rem;
    background:rgba(107,143,168,.16); color:#9cc4dd;
    border:1px solid rgba(107,143,168,.35);
    padding:.3rem .55rem; border-radius:6px;
    font-size:.72rem; font-weight:800; text-decoration:none;
    transition:background .2s ease;
  }
  .btn-mapa:hover{background:rgba(107,143,168,.32); color:#c7e2f2;}

  .pedido-nota{
    margin-top:.4rem; font-size:.76rem; color:var(--mostaza);
    background:rgba(227,160,8,.09); border-left:2px solid var(--mostaza);
    padding:.4rem .55rem; border-radius:0 6px 6px 0; line-height:1.45;
  }

  .pedido-items{
    margin:.7rem 0 .5rem; padding:.6rem .7rem;
    background:rgba(0,0,0,.28); border-radius:8px;
    font-size:.82rem; display:flex; flex-direction:column; gap:.3rem;
  }
  .pedido-items .it{display:flex; gap:.55rem; align-items:baseline;}
  .pedido-items .cant{
    font-weight:800; color:var(--mostaza); min-width:1.6rem;
    font-variant-numeric:tabular-nums;
  }
  .pedido-items .nom{flex:1; line-height:1.35;}
  .pedido-items .sub{color:var(--texto-secundario); font-size:.76rem; font-variant-numeric:tabular-nums;}

  .pedido-total{
    display:flex; justify-content:space-between; align-items:baseline;
    font-weight:800; font-size:1rem; color:var(--verde-brillo);
    padding-top:.5rem; border-top:1px solid var(--borde);
  }
  .pedido-total span:first-child{
    font-size:.75rem; color:var(--texto-secundario); font-weight:700;
    text-transform:uppercase; letter-spacing:.06em;
  }

  .pedido-acciones{display:flex; gap:.45rem; margin-top:.8rem; flex-wrap:wrap;}
  .acc-btn{
    flex:1; min-width:0; padding:.6rem .5rem; border-radius:8px;
    font-size:.76rem; font-weight:800; white-space:nowrap;
    background:var(--rojo); color:var(--crema-suave);
    transition:background .2s ease, transform .12s ease;
  }
  .acc-btn:hover{background:var(--rojo-brillo);}
  .acc-btn:active{transform:scale(.96);}
  .acc-btn.sec{background:rgba(247,236,214,.09); color:var(--texto-claro); flex:0 0 auto; padding:.6rem .7rem;}
  .acc-btn.sec:hover{background:rgba(247,236,214,.16);}
  .acc-btn.cancel{background:rgba(255,255,255,.05); color:#c98d86; flex:0 0 auto; padding:.6rem .7rem;}
  .acc-btn.cancel:hover{background:var(--rojo-oscuro); color:var(--crema-suave);}
  .acc-btn.copiar{background:var(--mostaza); color:var(--carbon);}
  .acc-btn.copiar:hover{background:#f0af1f;}
  .acc-btn.copiado{background:var(--verde) !important; color:var(--crema-suave) !important;}

  /* ---------- CRONOMETRO Y ESCALADA DE ALERTA ---------- */
  .cronometro{
    display:inline-flex; align-items:center; gap:.25rem;
    font-size:.72rem; font-weight:800; font-variant-numeric:tabular-nums;
    background:rgba(247,236,214,.08); color:var(--texto-secundario);
    padding:.2rem .45rem; border-radius:6px;
    transition:background .3s ease, color .3s ease;
  }

  /* A los 3 minutos: amarillo */
  .pedido.espera-media{ border-color:var(--mostaza); }
  .pedido.espera-media .cronometro{ background:rgba(227,160,8,.2); color:var(--mostaza); }

  /* A los 5 minutos: rojo parpadeante, mas insistente */
  .pedido.espera-alta{
    border-color:var(--rojo-brillo);
    animation:alerta-alta 1s ease-in-out infinite;
  }
  .pedido.espera-alta .cronometro{
    background:var(--rojo); color:var(--crema-suave);
    animation:parpadeo .8s ease-in-out infinite;
  }
  @keyframes alerta-alta{
    0%,100%{box-shadow:0 0 0 0 rgba(225,74,66,.7);}
    50%{box-shadow:0 0 0 9px rgba(225,74,66,0);}
  }
  @keyframes parpadeo{ 0%,100%{opacity:1;} 50%{opacity:.45;} }

  /* La escalada manda sobre el parpadeo de "sin ver" */
  .pedido.sin-ver.espera-alta{ animation:alerta-alta 1s ease-in-out infinite; }

  /* ---------- BANNER DE DESCONEXION ---------- */
  .banner-caido{
    position:sticky; top:0; z-index:150;
    display:none; align-items:center; justify-content:center; gap:.6rem;
    padding:.8rem 1.2rem; text-align:center;
    background:var(--rojo); color:var(--crema-suave);
    font-size:.9rem; font-weight:800; letter-spacing:.01em;
    box-shadow:0 6px 18px rgba(0,0,0,.4);
  }
  .banner-caido.visible{display:flex;}
  .banner-caido .foco{
    width:11px; height:11px; border-radius:50%; flex:none;
    background:var(--crema-suave);
    animation:foco-alerta .9s ease-in-out infinite;
  }
  @keyframes foco-alerta{ 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.25; transform:scale(.75);} }

  /* ---------- AVISO FLOTANTE ---------- */
  .toast{
    position:fixed; left:50%; bottom:1.5rem; transform:translate(-50%, 150%);
    background:var(--verde); color:var(--crema-suave);
    padding:.85rem 1.5rem; border-radius:999px; font-weight:800; font-size:.9rem;
    box-shadow:0 14px 34px rgba(0,0,0,.45); z-index:500;
    transition:transform .35s cubic-bezier(.2,.8,.3,1);
  }
  .toast.show{transform:translate(-50%, 0);}
  .toast.error{background:var(--rojo);}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div class="login-screen" id="loginScreen">
  <form class="login-card" id="loginForm">
    <img src="Recursos/logo/logo.png" alt="Los Taqueiros">
    <h1>Panel de comandas</h1>
    <p class="sub">Acceso solo para el restaurante</p>

    <label for="loginEmail">Usuario</label>
    <input type="email" id="loginEmail" autocomplete="username" required>

    <label for="loginPassword">Contraseña</label>
    <input type="password" id="loginPassword" autocomplete="current-password" required>

    <button type="submit" id="loginBtn">Entrar</button>
    <p class="login-error" id="loginError"></p>
  </form>
</div>

<!-- ================= PANEL ================= -->
<div id="app" hidden>
  <header>
    <div class="brand">
      <img src="Recursos/logo/logo.png" alt="Los Taqueiros">
      <div class="txt">
        <strong>COMANDAS</strong>
        <small id="fechaHoy"></small>
      </div>
    </div>

    <div class="conn" id="conn"><span class="dot"></span><span id="connTxt">Conectando…</span></div>
    <button class="tool-btn activo" id="soundBtn" title="Activar o silenciar el sonido">🔔 Sonido</button>
    <button class="tool-btn" id="notifBtn" title="Permitir notificaciones del navegador">🔕 Notificaciones</button>
    <button class="switch-local abierto" id="switchLocal" title="Abrir o cerrar el local manualmente">
      <span class="etiqueta" id="switchTexto">Abierto</span>
      <span class="switch-pista"></span>
    </button>
    <button class="tool-btn" id="horariosBtn" title="Ver y editar el horario">\u{1F553} Horario</button>
    <button class="tool-btn peligro" id="logoutBtn">Salir</button>
  </header>

  <div class="banner-caido" id="bannerCaido">
    <span class="foco"></span>
    <span>SIN CONEXIÓN — No estás recibiendo pedidos nuevos</span>
  </div>

  <main class="board" id="board"></main>
</div>

<div class="modal-fondo" id="modalHorarios">
  <div class="modal-horarios" role="dialog" aria-modal="true" aria-label="Horario de atencion">
    <h2>Horario de atención</h2>
    <p class="ayuda">Fuera de este horario los clientes no pueden pagar en línea, pero sí pueden escribir por WhatsApp. Desmarca un día para cerrarlo por completo.</p>

    <div id="filasHorario"></div>

    <label style="display:block; margin-top:1.1rem; font-size:.78rem; font-weight:700; color:var(--texto-secundario);">
      Mensaje que ve el cliente cuando está cerrado (opcional)
    </label>
    <textarea class="campo-mensaje" id="mensajeCerrado" rows="2"
      placeholder="Si lo dejas vacío se muestra la hora de apertura automáticamente"></textarea>

    <div class="acciones-modal">
      <button class="btn-cancelar" id="cancelarHorarios">Cancelar</button>
      <button class="btn-guardar" id="guardarHorarios">Guardar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* =========================================================
   CONFIGURACIÓN DE SUPABASE
   La "anon key" es pública por diseño: sin la contraseña del
   restaurante no sirve de nada, porque la tabla tiene RLS activo
   y solo responde a usuarios autenticados.
========================================================= */

/* =========================================================
   UTILIDADES
========================================================= */
function formatoCOP(n){
  return "$" + Number(n || 0).toLocaleString("es-CO");
}
function numeroPedido(p){
  return "#" + String(p.id).padStart(3, "0");
}
function horaCorta(iso){
  const d = new Date(iso);
  return d.toLocaleTimeString("es-CO", { hour:"2-digit", minute:"2-digit", hour12:true });
}
function telefonoBonito(t){
  const s = String(t || "");
  return s.length === 10 ? s.slice(0,3) + " " + s.slice(3,6) + " " + s.slice(6) : s;
}
function escapar(texto){
  const d = document.createElement("div");
  d.textContent = texto == null ? "" : String(texto);
  return d.innerHTML;
}
function cargarVistos(){
  try{ return new Set(JSON.parse(localStorage.getItem(VISTOS_KEY) || "[]")); }
  catch(e){ return new Set(); }
}
function guardarVistos(){
  // Solo se conservan los últimos 300 para no llenar el almacenamiento
  localStorage.setItem(VISTOS_KEY, JSON.stringify([...vistos].slice(-300)));
}

let toastTimer = null;
function avisar(mensaje, esError){
  const t = document.getElementById("toast");
  t.textContent = mensaje;
  t.classList.toggle("error", !!esError);
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

   se bloquea de inmediato y borra los pedidos que tenía en pantalla.
   Sin sesión no queda ningún dato de clientes a la vista. */
db.auth.onAuthStateChange((evento, sesion) => {
  if(sesion) return;
  if(evento === "SIGNED_OUT" || evento === "TOKEN_REFRESHED"){
    pedidos = [];
    const app = document.getElementById("app");
    if(!app.hidden){
      app.hidden = true;
      loginScreen.classList.remove("hidden");
      render();
    }
  }
});

/* =========================================================
   DATOS
========================================================= */
async function cargarPedidos(){
  // Los 'pendiente_pago' NO se muestran: son intentos de pago
  // que nunca se completaron.
  const { data, error } = await db
    .from("pedidos")
    .select("*")
    .neq("estado", "pendiente_pago")
    .order("creado_en", { ascending:false })
    .limit(200);

  if(error){
    avisar("No se pudieron cargar los pedidos", true);
    console.error(error);
    return;
  }
  pedidos = data || [];
  render();
}

/* =========================================================
   ESTADO DE LA CONEXION

   Si al restaurante se le cae el internet, deja de recibir pedidos
   sin enterarse. Aqui se vigilan dos senales:
     - el canal de Supabase Realtime (la que de verdad importa)
     - navigator.onLine, como aviso temprano del navegador

   Al recuperarse, se recargan los pedidos que hayan entrado
   mientras estuvo caido y se avisa cuantos llegaron.
========================================================= */
let conexionViva = true;

function marcarConexion(viva, motivo){
  const conn = document.getElementById("conn");
  const connTxt = document.getElementById("connTxt");
  const banner = document.getElementById("bannerCaido");
  const eraViva = conexionViva;
  conexionViva = viva;

  conn.className = viva ? "conn online" : "conn offline";
  connTxt.textContent = viva ? "En vivo" : "Desconectado";
  banner.classList.toggle("visible", !viva);

  if(!viva && eraViva){
    console.warn("[Conexion] Se perdio la conexion:", motivo || "");
    sonarInsistente();
  }

  // Al volver: recuperar lo que entro mientras estuvo caido
  if(viva && !eraViva){
    console.log("[Conexion] Restablecida, recargando pedidos");
    recuperarPedidosPerdidos();
  }
}

async function recuperarPedidosPerdidos(){
  const antes = pedidos.map(p => p.id);
  await cargarPedidos();

  const nuevos = pedidos.filter(p => !antes.includes(p.id) && p.estado === "nuevo");
  if(nuevos.length){
    sonarInsistente();
    avisar("✅ Conexión restablecida — " + nuevos.length +
           (nuevos.length === 1 ? " pedido nuevo" : " pedidos nuevos"));
  }else{
    avisar("✅ Conexión restablecida");
  }
}

/* navigator.onLine avisa antes que el websocket, pero no es fiable
   por si solo: dice si hay red, no si Supabase responde. Por eso se
   usa como senal complementaria, nunca como unica fuente. */
window.addEventListener("offline", () => marcarConexion(false, "navigator.onLine"));
window.addEventListener("online", async () => {
  // La red volvio, pero el canal puede tardar en reconectar
  await cargarPedidos();
});

function suscribirse(){
  db.channel("pedidos-panel")
    .on("postgres_changes", { event:"*", schema:"public", table:"pedidos" }, (payload) => {
      const fila = payload.new;
      if(!fila || !fila.id) return;

      const i = pedidos.findIndex(p => p.id === fila.id);

      // Un pedido sin pagar no se muestra en el tablero
      if(fila.estado === "pendiente_pago"){
        if(i >= 0){ pedidos.splice(i, 1); render(); }
        return;
      }

      const esNuevoEnElTablero = i < 0;
      if(i >= 0){ pedidos[i] = fila; }
      else{ pedidos.unshift(fila); }

      // Suena solo cuando un pedido pagado aparece por primera vez
      if(esNuevoEnElTablero && fila.estado === "nuevo"){
        anunciarPedido(fila);
      }
      render();
    })
    .on("postgres_changes", { event:"*", schema:"public", table:"configuracion" }, (payload) => {
      // Si cierran el local desde otro dispositivo, este panel se entera
      if(payload.new){
        configuracion = payload.new;
        pintarSwitch();
      }
    })
    .subscribe((estado) => {
      if(estado === "SUBSCRIBED"){
        marcarConexion(true);
      }else if(estado === "CHANNEL_ERROR" || estado === "TIMED_OUT" || estado === "CLOSED"){
        marcarConexion(false, estado);
      }
    });
}

/* =========================================================
   AVISO DE PEDIDO NUEVO (sonido + notificación)
========================================================= */
function sonar(){
  if(!sonidoActivo) return;
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx();
    // Dos tonos cortos, audibles en una cocina con ruido
    [0, 0.22].forEach((retraso, i) => {
      const osc = ctx.createOscillator();
      const vol = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = i === 0 ? 880 : 1170;
      vol.gain.setValueAtTime(0.0001, ctx.currentTime + retraso);
      vol.gain.exponentialRampToValueAtTime(0.35, ctx.currentTime + retraso + 0.03);
      vol.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + retraso + 0.20);
      osc.connect(vol); vol.connect(ctx.destination);
      osc.start(ctx.currentTime + retraso);
      osc.stop(ctx.currentTime + retraso + 0.22);
    });
    setTimeout(() => ctx.close(), 900);
  }catch(e){ /* si el navegador bloquea el audio, no pasa nada */ }
}

function anunciarPedido(pedido){
  sonar();
  avisar("🌮 Nuevo pedido " + numeroPedido(pedido) + " · " + formatoCOP(pedido.total));

  if(("Notification" in window) && Notification.permission === "granted"){
    try{
      new Notification("Nuevo pedido " + numeroPedido(pedido), {
        body: pedido.cliente_nombre + " · " + formatoCOP(pedido.total)
              + "\n" + (TEXTO_TIPO[pedido.tipo_pedido] || ""),
        icon: "Recursos/logo/logo.png",
        tag: "pedido-" + pedido.id
      });
    }catch(e){ /* algunos navegadores lo bloquean */ }
  }
}

/* =========================================================
   CONFIGURACION DEL LOCAL (horario y cierre manual)
========================================================= */
const DIAS_SEMANA = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
let configuracion = null;

async function cargarConfiguracion(){
  const { data, error } = await db.from("configuracion").select("*").eq("id", 1).maybeSingle();
  if(error){
    console.error(error);
    return;
  }
  configuracion = data;
  pintarSwitch();
}

function pintarSwitch(){
  const boton = document.getElementById("switchLocal");
  const texto = document.getElementById("switchTexto");
  if(!configuracion) return;

  const cerrado = !!configuracion.cerrado_temporal;
  boton.classList.toggle("abierto", !cerrado);
  boton.classList.toggle("cerrado", cerrado);
  texto.textContent = cerrado ? "Cerrado" : "Abierto";
}

/* Interruptor manual: cierra o abre el local al instante */
document.getElementById("switchLocal").addEventListener("click", async () => {
  if(!configuracion) return;
  const nuevoValor = !configuracion.cerrado_temporal;

  if(nuevoValor && !confirm("¿Cerrar el local? Los clientes no podrán pagar en línea hasta que lo vuelvas a abrir.")) return;

  const { error } = await db.from("configuracion")
    .update({ cerrado_temporal: nuevoValor }).eq("id", 1);

  if(error){
    avisar("No se pudo cambiar el estado", true);
    console.error(error);
    return;
  }
  configuracion.cerrado_temporal = nuevoValor;
  pintarSwitch();
  avisar(nuevoValor ? "🔴 Local cerrado" : "🟢 Local abierto");
});

/* ---- Modal de horarios ---- */
const modalHorarios = document.getElementById("modalHorarios");

function abrirHorarios(){
  if(!configuracion){ avisar("Todavía no se cargó la configuración", true); return; }

  const horarios = Array.isArray(configuracion.horarios) ? configuracion.horarios : [];
  document.getElementById("filasHorario").innerHTML = DIAS_SEMANA.map((dia, i) => {
    const h = horarios[i] || { abre:"11:00", cierra:"22:00", activo:true };
    const activo = h.activo !== false;
    return '<div class="fila-dia" data-dia="' + i + '">' +
      '<span class="nombre">' + dia + '</span>' +
      '<span class="abre-cierra">' +
        '<input type="time" class="abre" value="' + h.abre + '"' + (activo ? "" : " disabled") + '>' +
        '<span style="color:var(--texto-secundario);">a</span>' +
        '<input type="time" class="cierra" value="' + h.cierra + '"' + (activo ? "" : " disabled") + '>' +
      '</span>' +
      '<label class="activo"><input type="checkbox" class="chk-activo"' + (activo ? " checked" : "") + '> abre</label>' +
    '</div>';
  }).join("");

  // Al desmarcar un día se apagan sus horas
  document.querySelectorAll("#filasHorario .chk-activo").forEach(chk => {
    chk.addEventListener("change", (e) => {
      const fila = e.target.closest(".fila-dia");
      fila.querySelectorAll('input[type="time"]').forEach(i => { i.disabled = !e.target.checked; });
    });
  });

  document.getElementById("mensajeCerrado").value = configuracion.mensaje_cerrado || "";
  modalHorarios.classList.add("open");
}

function cerrarHorarios(){ modalHorarios.classList.remove("open"); }

document.getElementById("horariosBtn").addEventListener("click", abrirHorarios);
document.getElementById("cancelarHorarios").addEventListener("click", cerrarHorarios);
modalHorarios.addEventListener("click", (e) => { if(e.target === modalHorarios) cerrarHorarios(); });

document.getElementById("guardarHorarios").addEventListener("click", async (e) => {
  const boton = e.currentTarget;
  const horarios = [...document.querySelectorAll("#filasHorario .fila-dia")].map((fila, i) => ({
    dia: DIAS_SEMANA[i],
    abre: fila.querySelector(".abre").value || "11:00",
    cierra: fila.querySelector(".cierra").value || "22:00",
    activo: fila.querySelector(".chk-activo").checked
  }));

  // Un cierre antes de la apertura dejaria el local cerrado siempre
  const invalido = horarios.find(h => h.activo && h.abre >= h.cierra);
  if(invalido){
    avisar("En " + invalido.dia + " la hora de cierre debe ser posterior a la de apertura", true);
    return;
  }

  boton.disabled = true;
  const mensaje = document.getElementById("mensajeCerrado").value.trim();

  const { error } = await db.from("configuracion")
    .update({ horarios, mensaje_cerrado: mensaje || null }).eq("id", 1);
  boton.disabled = false;

  if(error){
    avisar("No se pudo guardar el horario", true);
    console.error(error);
    return;
  }

  configuracion.horarios = horarios;
  configuracion.mensaje_cerrado = mensaje || null;
  cerrarHorarios();
  avisar("Horario guardado");
});

/* =========================================================
   RENDER DEL TABLERO
========================================================= */
function dibujarTablero(){
  document.getElementById("board").innerHTML = COLUMNAS.map(c =>
    '<section class="col" data-estado="' + c.estado + '">' +
      '<div class="col-head">' +
        '<span class="punto"></span>' +
        '<h2>' + c.titulo + '</h2>' +
        '<span class="contador" id="cont-' + c.estado + '">0</span>' +
      '</div>' +
      '<div class="col-body" id="body-' + c.estado + '"></div>' +
    '</section>'
  ).join("");
}

function render(){
  COLUMNAS.forEach(c => {
    const delEstado = pedidos.filter(p => p.estado === c.estado);
    document.getElementById("cont-" + c.estado).textContent = delEstado.length;

    const cuerpo = document.getElementById("body-" + c.estado);
    cuerpo.innerHTML = delEstado.length === 0
      ? '<div class="col-vacia">Sin pedidos</div>'
      : delEstado.map(tarjeta).join("");
  });

  // Los cronometros se pintan de una vez, sin esperar al siguiente
  // segundo, para que no aparezca "--" al recargar el tablero.
  actualizarCronometros();
}

function tarjeta(p){
  const sinVer = p.estado === "nuevo" && !vistos.has(p.id);

  const items = (p.items || []).map(it =>
    '<div class="it">' +
      '<span class="cant">' + it.cantidad + '×</span>' +
      '<span class="nom">' + escapar(it.nombre) + '</span>' +
      '<span class="sub">' + formatoCOP(it.precio * it.cantidad) + '</span>' +
    '</div>'
  ).join("");

  const entrega = p.tipo_pedido === "domicilio"
    ? '<div class="pedido-entrega">' + ICONO_TIPO.domicilio + ' <strong>Domicilio</strong><br>' +
        '<span class="dir">' + escapar(p.direccion) + (p.barrio ? " · " + escapar(p.barrio) : "") + '</span>' +
      '</div>'
    : '<div class="pedido-entrega">' + (ICONO_TIPO[p.tipo_pedido] || "") +
        ' <strong>' + (TEXTO_TIPO[p.tipo_pedido] || escapar(p.tipo_pedido)) + '</strong></div>';

  const nota = p.indicaciones
    ? '<div class="pedido-nota">📝 ' + escapar(p.indicaciones) + '</div>'
    : "";

  // Datos del domicilio: costo, distancia y enlace a Google Maps
  let envio = "";
  if(p.tipo_pedido === "domicilio"){
    const partes = [];
    if(p.distancia_km != null) partes.push("📍 " + p.distancia_km + " km");

    if(p.fuera_de_cobertura){
      partes.push('<span class="fuera">⚠️ Fuera de zona — cobrar domicilio aparte</span>');
    }else if(Number(p.costo_domicilio) > 0){
      partes.push("🛵 " + formatoCOP(p.costo_domicilio));
    }

    let enlace = "";
    if(p.lat != null && p.lng != null){
      enlace = '<a class="btn-mapa" href="https://www.google.com/maps/search/?api=1&query='
        + p.lat + ',' + p.lng + '" target="_blank" rel="noopener">🗺️ Ver en mapa</a>';
    }

    if(partes.length || enlace){
      envio = '<div class="pedido-envio">' + partes.join(" · ") + enlace + '</div>';
    }
  }

  const sig = SIGUIENTE[p.estado];
  const ant = ANTERIOR[p.estado];
  const acciones = [];

  if(ant) acciones.push('<button class="acc-btn sec" data-mover="' + p.id + '" data-a="' + ant.estado + '" title="Volver al estado anterior">' + ant.etiqueta + '</button>');
  if(sig) acciones.push('<button class="acc-btn" data-mover="' + p.id + '" data-a="' + sig.estado + '">' + sig.etiqueta + '</button>');
  acciones.push('<button class="acc-btn copiar" data-copiar="' + p.id + '">📋 Copiar</button>');
  if(p.estado !== "cancelado" && p.estado !== "entregado"){
    acciones.push('<button class="acc-btn cancel" data-mover="' + p.id + '" data-a="cancelado" title="Cancelar pedido">✕</button>');
  }

  return '<article class="pedido ' + (sinVer ? "sin-ver" : "") + '" data-id="' + p.id + '">' +
    '<div class="pedido-top">' +
      '<span class="pedido-num">' + numeroPedido(p) + '</span>' +
      '<span class="badge-pagado">PAGADO ' + formatoCOP(p.total) + '</span>' +
      (p.estado === "nuevo"
        ? '<span class="cronometro" data-desde="' + (p.pagado_en || p.creado_en) + '">\u23F1 --</span>'
        : "") +
      '<span class="pedido-hora">' + horaCorta(p.pagado_en || p.creado_en) + '</span>' +
    '</div>' +
    '<div class="pedido-cliente">' + escapar(p.cliente_nombre) + '</div>' +
    '<a class="pedido-tel" href="tel:+57' + escapar(p.cliente_telefono) + '">📞 ' + telefonoBonito(p.cliente_telefono) + '</a>' +
    entrega +
    envio +
    nota +
    '<div class="pedido-items">' + items + '</div>' +
    (Number(p.costo_domicilio) > 0
      ? '<div class="pedido-total" style="border-top:none; padding-top:.2rem; color:var(--texto-secundario);">'
        + '<span>Productos</span><span style="font-size:.85rem;">'
        + formatoCOP(p.subtotal != null ? p.subtotal : p.total - p.costo_domicilio) + '</span></div>'
      : "") +
    '<div class="pedido-total"><span>Total</span><span>' + formatoCOP(p.total) + '</span></div>' +
    '<div class="pedido-acciones">' + acciones.join("") + '</div>' +
  '</article>';
}

/* =========================================================
   ESCALADA: PEDIDOS QUE LLEVAN MUCHO ESPERANDO

   Un pedido pagado que nadie ve es el peor escenario. El contador
   corre mientras la tarjeta este en "Nuevo" y se detiene sola en
   cuanto la mueven a "En preparacion" (porque deja de existir en
   esa columna).

   A los 3 minutos la tarjeta se pone amarilla y vuelve a sonar.
   A los 5 se pone roja parpadeante y suena de forma mas insistente,
   repitiendose cada minuto hasta que alguien la atienda.
========================================================= */
const MINUTOS_AVISO_MEDIO = 3;
const MINUTOS_AVISO_ALTO  = 5;

/* Recuerda por que nivel ya paso cada pedido, para no sonar en cada
   segundo sino solo cuando cruza el umbral. */
const nivelAvisado = new Map();

function minutosEsperando(desde){
  return Math.floor((Date.now() - new Date(desde).getTime()) / 60000);
}

function actualizarCronometros(){
  document.querySelectorAll(".cronometro").forEach((reloj) => {
    const tarjeta = reloj.closest(".pedido");
    if(!tarjeta) return;

    const id = Number(tarjeta.dataset.id);
    const minutos = minutosEsperando(reloj.dataset.desde);

    reloj.textContent = "\u23F1 " + (minutos < 1 ? "recién" : minutos + " min");

    const nivel = minutos >= MINUTOS_AVISO_ALTO ? 2
                : minutos >= MINUTOS_AVISO_MEDIO ? 1 : 0;

    tarjeta.classList.toggle("espera-media", nivel === 1);
    tarjeta.classList.toggle("espera-alta", nivel === 2);

    const previo = nivelAvisado.get(id) || 0;

    if(nivel > previo){
      // Recién cruzó un umbral: suena y avisa
      nivelAvisado.set(id, nivel);
      if(nivel === 1){
        sonar();
        avisar("\u23F1 Pedido " + numeroPedido({id:id}) + " lleva " + minutos + " min sin atender");
      }else{
        sonarInsistente();
        avisar("\u26A0\uFE0F Pedido " + numeroPedido({id:id}) + " lleva " + minutos + " min SIN ATENDER", true);
      }
    }else if(nivel === 2){
      // Mientras siga sin atenderse, se insiste una vez por minuto
      if(nivelAvisado.get("m" + id) !== minutos){
        nivelAvisado.set("m" + id, minutos);
        sonarInsistente();
      }
    }
  });
}

/* Sonido mas insistente: tres tonos seguidos y mas graves */
function sonarInsistente(){
  if(!sonidoActivo) return;
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx();
    [0, 0.18, 0.36].forEach((retraso) => {
      const osc = ctx.createOscillator();
      const vol = ctx.createGain();
      osc.type = "square";
      osc.frequency.value = 660;
      vol.gain.setValueAtTime(0.0001, ctx.currentTime + retraso);
      vol.gain.exponentialRampToValueAtTime(0.30, ctx.currentTime + retraso + 0.03);
      vol.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + retraso + 0.16);
      osc.connect(vol); vol.connect(ctx.destination);
      osc.start(ctx.currentTime + retraso);
      osc.stop(ctx.currentTime + retraso + 0.18);
    });
    setTimeout(() => ctx.close(), 1200);
  }catch(e){ /* si el navegador bloquea el audio, no pasa nada */ }
}

setInterval(actualizarCronometros, 1000);

/* =========================================================
   ACCIONES SOBRE LAS TARJETAS
========================================================= */
document.getElementById("board").addEventListener("click", async (e) => {
  const btnMover = e.target.closest("[data-mover]");
  const btnCopiar = e.target.closest("[data-copiar]");
  const tarjetaEl = e.target.closest(".pedido");

  // Abrir la tarjeta la marca como vista y deja de parpadear
  if(tarjetaEl && !btnMover && !btnCopiar){
    const id = Number(tarjetaEl.dataset.id);
    if(!vistos.has(id)){
      vistos.add(id);
      guardarVistos();
      tarjetaEl.classList.remove("sin-ver");
    }
    return;
  }

  if(btnCopiar){
    e.stopPropagation();
    const p = pedidos.find(x => x.id === Number(btnCopiar.dataset.copiar));
    if(p) copiarComanda(p, btnCopiar);
    return;
  }

  if(btnMover){
    e.stopPropagation();
    const id = Number(btnMover.dataset.mover);
    const nuevoEstado = btnMover.dataset.a;

    if(nuevoEstado === "cancelado" && !confirm("¿Cancelar este pedido? El cliente ya pagó.")) return;

    vistos.add(id); guardarVistos();

    // El pedido sale de "Nuevo": su cronometro deja de importar
    nivelAvisado.delete(id);
    nivelAvisado.delete("m" + id);

    btnMover.disabled = true;
    const { error } = await db.from("pedidos").update({ estado: nuevoEstado }).eq("id", id);
    btnMover.disabled = false;

    if(error){
      avisar("No se pudo actualizar el pedido", true);
      console.error(error);
      return;
    }
    // Se refleja de una vez; Realtime confirma después
    const i = pedidos.findIndex(x => x.id === id);
    if(i >= 0){ pedidos[i].estado = nuevoEstado; render(); }
  }
});

/* =========================================================
   COPIAR COMANDA
   Formato pensado para transcribir rápido al sistema de
   facturación: cantidad a la izquierda, nombres alineados
   y precios a la derecha.
========================================================= */
function construirComanda(p){
  const lineas = [];
  lineas.push("PEDIDO WEB " + numeroPedido(p) + " — PAGADO");
  lineas.push(p.cliente_nombre + " · " + telefonoBonito(p.cliente_telefono));

  if(p.tipo_pedido === "domicilio"){
    lineas.push("Domicilio: " + p.direccion + (p.barrio ? ", " + p.barrio : ""));
  }else{
    lineas.push(TEXTO_TIPO[p.tipo_pedido] || p.tipo_pedido);
  }
  if(p.indicaciones){
    lineas.push('Ref: "' + p.indicaciones + '"');
  }
  lineas.push("");

  const items = p.items || [];
  const anchoNombre = Math.max(18, ...items.map(it => String(it.nombre).length));

  items.forEach(it => {
    const cant = String(it.cantidad).padStart(2, " ");
    const nom = String(it.nombre).padEnd(anchoNombre + 2, " ");
    const val = formatoCOP(it.precio * it.cantidad).padStart(9, " ");
    lineas.push(cant + "  " + nom + val);
  });

  if(p.tipo_pedido === "domicilio"){
    if(p.fuera_de_cobertura){
      lineas.push("");
      lineas.push("DOMICILIO: fuera de zona, cobrar aparte"
        + (p.distancia_km != null ? " (" + p.distancia_km + " km)" : ""));
    }else if(Number(p.costo_domicilio) > 0){
      const nombreEnvio = "Domicilio" + (p.distancia_km != null ? " (" + p.distancia_km + " km)" : "");
      lineas.push("   " + nombreEnvio.padEnd(anchoNombre + 2, " ")
        + formatoCOP(p.costo_domicilio).padStart(9, " "));
    }
  }

  lineas.push("");
  lineas.push("TOTAL: " + formatoCOP(p.total));

  return lineas.join("\n");
}

async function copiarComanda(p, boton){
  const texto = construirComanda(p);
  const original = boton.textContent;
  let copiado = false;

  try{
    await navigator.clipboard.writeText(texto);
    copiado = true;
  }catch(e){
    // Respaldo para navegadores que bloquean el portapapeles
    const ta = document.createElement("textarea");
    ta.value = texto;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try{ copiado = document.execCommand("copy"); }catch(err){ copiado = false; }
    document.body.removeChild(ta);
  }

  if(!copiado){
    avisar("No se pudo copiar la comanda", true);
    return;
  }

  boton.textContent = "✓ Copiado";
  boton.classList.add("copiado");
  setTimeout(() => {
    boton.textContent = original;
    boton.classList.remove("copiado");
  }, 1600);
}
</script>
